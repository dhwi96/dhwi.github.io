name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Audit site configuration
        run: bundle exec al-folio upgrade audit --no-fail
      - name: Audit site style overrides
        run: bundle exec al-folio upgrade overrides audit --fail-on-stale
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Verify migration output
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          test -f _site/teaching/index.html
          test -f _site/assets/img/research/profile.jpg
          grep -q 'CompMVR' _site/index.html
          grep -q 'kAeQFX4AAAAJ' _site/index.html
          if grep -q 'Albert Einstein' _site/index.html; then exit 1; fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
